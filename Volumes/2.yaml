apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: test-ns
  labels:
    app: nginx
spec:
  securityContext: {}
  initContainers: {}
  nodeSelector: {}
  affinity: {}
  restartPolicy: Always
  containers:
    - name: c1
      image: nginx
      ports:
        - containerPort: 80
      volumeMounts:
        - name: www
          mountPath: /tmp/data
      resources:
        requests:
          memory: 256Mi
          cpu: 150m
        limits:
          
  volumes:
    - name: www
      persistentVolumeClaim:
        claimName: www-pvc