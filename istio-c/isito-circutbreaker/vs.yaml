apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nginx-vs
  namespace: test
spec:
  hosts:
    - nginx
  http:
    - route:
        - destination:
            host: my-app-service.test.svc.cluster.local
      fault:
            delay:
              percentage:
                value: 100
              fixedDelay: 2s