apiVersion: v1
kind: Secret
metadata:
  name: sec1
data:
  name1: name1
  key: key1
---
apiVersion: v1
kind: Pod
metadata:
  name: pod1
spec:
  restartPolicy: Never
  containers:
    - name: c1
      image: nginx
      envFrom:
        - secretRef:
            name: c1
      env:
        - name: c1
          valueFrom:
            configMapRef:
              name:
              key:
      ports:
        - containerPort: 80
      volumeMounts:
        - name: ww
          mountPath: /tmp/data
  volumes:
    - name: www
      secret:
        secretName: sec1