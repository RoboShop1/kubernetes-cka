apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress1
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: app2.chaithanya.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-app-service
                port:
                  number: 80
  tls:
    - hosts:
        - app2.chaithanya.cloud
      secretName: devtls